[package]
name = "Astria"
version = "0.1.0"
edition = "2021"
authors = ["Tiago Perrelli <1470890+tperrelli@users.noreply.github.com>"]
description = "A local-first, semantic-aware Version Control System built in Rust"
license = "Apache-2.0"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.13"
tree-sitter = "0.24"      # Core parsing engine for AST extraction
tree-sitter-rust = "0.23" # Rust grammar parser (example for our first AST analyzer)
lancedb = "0.14"          # Embedded vector database
tokio = { version = "1.0", features = ["full"] } # Async runtime required by LanceDB
arrow-array = "53.0"      # Apache Arrow data structures for LanceDB
arrow-schema = "53.0"
clap = { version = "4.4", features = ["derive"] } # CLI argument parsing
futures = "0.3" # Necessary to iterate over LanceDB stream
chrono = "0.4"
async-trait = "0.1"
fastembed = "4"

[[bin]]
name = "ast"
path = "src/main.rs"